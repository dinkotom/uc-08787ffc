name: build-and-deploy

on:
  schedule:
    - cron: "0 2 * * *"   # jednou denně, 02:00 UTC = 4:00 (léto) / 3:00 (zima) Praha
                          # (noční notifikační e-mail ČS to stihne)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # keepalive
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Prague
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build encrypted balance page
        env:
          BANK_EMAIL_USER: ${{ secrets.BANK_EMAIL_USER }}
          BANK_EMAIL_PASSWORD: ${{ secrets.BANK_EMAIL_PASSWORD }}
          BANK_ACCOUNTS: ${{ secrets.BANK_ACCOUNTS }}
          BALANCE_PASSWORD: ${{ secrets.BALANCE_PASSWORD }}
        run: python build_balance.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Keepalive (prevent cron disable)
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Dní od posledního commitu: $days"
          if [ "$days" -ge 50 ]; then
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
